name: Sincronizar Klingo

on:
  schedule:
    - cron: "0 10-22 * * 1-6" # de hora em hora, 07h às 19h em Salvador (UTC-3), segunda a sábado
    - cron: "0 6 * * *" # 03h em Salvador: reconciliação (meses anteriores)
  workflow_dispatch:
    inputs:
      modo:
        description: "horario (mês atual e anterior) ou reconciliacao (últimos meses)"
        required: false
        default: horario
        type: choice
        options: [horario, reconciliacao]
      desde:
        description: "Carga histórica: buscar desde AAAA-MM (ex.: 2025-01). Deixe vazio no uso normal."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sync-klingo
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Bahia
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robo/requirements.txt

      - name: Cache do navegador (Playwright)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('robo/requirements.txt') }}

      - name: Instalar dependências
        run: |
          pip install -r robo/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sincronizar
        env:
          KLINGO_USUARIO: ${{ secrets.KLINGO_USUARIO }}
          KLINGO_SENHA: ${{ secrets.KLINGO_SENHA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # endereço de produção da Vercel (sempre disponível, independente do domínio próprio)
          TRACKCO_URL: ${{ vars.TRACKCO_URL || 'https://trackco.vercel.app' }}
          TRACKCO_RECALC_TOKEN: ${{ secrets.TRACKCO_RECALC_TOKEN }}
          MODO: ${{ github.event.inputs.modo || (github.event.schedule == '0 6 * * *' && 'reconciliacao') || 'horario' }}
          DESDE: ${{ github.event.inputs.desde }}
        run: |
          if [ -n "$DESDE" ]; then
            python robo/sync_klingo.py --desde "$DESDE"
          else
            python robo/sync_klingo.py --modo "$MODO"
          fi
