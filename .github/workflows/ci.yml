name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npx next typegen && npx tsc --noEmit
      - name: Lint
        run: npx eslint src supabase
      - name: Motor de cálculo + migrations/RLS (PGlite)
        run: npx vitest run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Robô (cruzamento 2331 x 319)
        run: python robo/test_cruzamento.py
